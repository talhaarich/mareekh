# Jezero walk region and the pipeline build config, in one file.
#
# Walk region (owner: Sadia): name, base_name, base, bounds. Read by pipeline/stations.py.
# Schema is a proposal (CONTRACTS.md does not define this file).
# Coordinates are degrees, longitude east, in the same frame as the rover waypoint file
# (base below matches Perseverance's position on sol 13 to about 1 m).
#
# Build config (owner: Murshad): out_dir, build_dir, dem_src, layers. Read by
# `python -m pipeline build pipeline/manifests/jezero.yaml`, run from the repo root.
# Raw files live in data/raw/ (not in git; names and links in docs/data-log.md).

name: Jezero Crater, crater floor and western delta front
base_name: Base

base:
  # Near Perseverance's landing site (Octavia E. Butler Landing).
  lat: 18.4446
  lon: 77.4509

# Walk box [south, west, north, east], about 8 x 6 km (400 x 300 cells at 20 m).
# This is the area the route grid covers, NOT the larger area the raw data was downloaded for
# (17.95-18.85 N, 77.10-78.00 E; see docs/data-log.md).
# Checked with stations.build_stations on the real waypoint file: every point is at least 500 m inside.
# Margins: B 2051 m, S1 1599 m, S2 1616 m, S3 1463 m.
bounds: [18.41, 77.38, 18.512, 77.522]

# ---------- build ----------

out_dir: web/public/data/jezero
build_dir: build/pipeline          # intermediate files (clipped.tif); never deployed
dem_src: data/raw/M20_JezeroCrater_CTXDEM_20m.tif   # data-log row 1; clipped to `bounds`, never reprojected

# Layer keys: id, name, group (view | overlay), type (image | terrain), src, url, default,
# render (grey | rgb | hillshade | elevation | topo), nearest, nodata, options, legend or classes,
# credit, caveat. See pipeline/steps/overlays.py for the render modes.
layers:
  - id: satellite
    name: Satellite
    group: view
    type: image
    src: data/raw/M20_JezeroCrater_CTXortho_mosaic_5m.tif   # data-log row 3
    url: overlays/satellite.png
    default: true
    render: grey
    nodata: 0          # the photo stores no nodata; 0 is no data (data-log row 3)
    credit: "NASA/JPL/MSSS (MRO CTX); mosaic by USGS Astrogeology / JPL"
    caveat: "5 m per pixel. Rocks are not visible."

  - id: relief
    name: Relief
    group: view
    type: image
    src: data/raw/M20_JezeroCrater_CTXDEM_20m.tif
    url: overlays/relief.png
    render: hillshade
    options: { scale: 4 }
    credit: "Shading derived from the CTX height map (NASA/JPL/MSSS; mosaic by USGS Astrogeology)"
    caveat: "Shading only, light from the north-west."

  - id: topo
    name: Topo
    group: view
    type: image
    src: data/raw/M20_JezeroCrater_CTXDEM_20m.tif
    url: overlays/topo.png
    render: topo
    options: { scale: 4, interval_m: 10, index_every: 5 }
    credit: "Contours derived from the CTX height map (NASA/JPL/MSSS; mosaic by USGS Astrogeology)"
    caveat: "Contours every 10 m, darker every 50 m, from 20 m data."

  - id: elevation
    name: Elevation
    group: view
    type: image
    src: data/raw/M20_JezeroCrater_CTXDEM_20m.tif
    url: overlays/elevation.png
    render: elevation
    options: { scale: 4, ramp: ["#213899", "#2a9d8f", "#e9c46a", "#d13829"] }   # legend built from the data
    credit: "CTX height map (NASA/JPL/MSSS; mosaic by USGS Astrogeology)"
    caveat: "Heights relative to the Mars areoid (MOLA), so they are negative here."

  - id: minerals
    name: Minerals
    group: overlay
    type: image
    src: data/raw/jezeroFinal.tif   # data-log row 4; its own CRS (lat_ts 0), drawn by its own corners
    url: overlays/minerals.png
    render: rgb
    nearest: true
    # Colour key from Jezero_readme.pdf (Parente et al.): high-confidence colour first, then medium.
    # The legend lists only the classes that occur inside the walk box.
    classes:
      - { label: Olivine, colors: ["#ff0000", "#990000"] }
      - { label: Mg-carbonate, colors: ["#00ff00", "#009900"] }
      - { label: Fe/Mg-smectite, colors: ["#00ffff", "#009999"] }
      - { label: Olivine + smectite, colors: ["#ff8072", "#994d44"] }
      - { label: "Olivine, smectite + 2.2 µm", colors: ["#808000", "#4d4d00"] }
      - { label: "Carbonate + 2.2 µm", colors: ["#ffd700", "#998100"] }
      - { label: High-Ca pyroxene, colors: ["#ff8000", "#994d00"] }
      - { label: Low-Ca pyroxene, colors: ["#daa520", "#826313"] }
      - { label: Kaolinite, colors: ["#8b4513", "#53290b"] }
      - { label: Mg-smectite 2, colors: ["#0000ff", "#000099"] }
    credit: "Parente, Saranathan, Itoh et al. (2021), CRISM mineral map, Zenodo 5575824, CC BY 4.0"
    caveat: "Partial coverage. A class map of the closest spectral match, not a measurement at each point. Bold colours: very high confidence; dark colours: high or medium."

  - id: geology
    name: Rock units
    group: overlay
    type: image
    src: data/raw/sim3464_JezeroNili_FINAL/Geodatabase/Nili.gdb   # USGS SIM 3464 database (data-log row 12)
    url: overlays/geology.png
    render: units            # vector polygons burned onto the height grid (pipeline/steps/units.py)
    layer: GeoUnits_v1
    field: unit
    options: { scale: 4 }
    # Unit codes and symbols are the map's own; the database stores only Esri colour IDs, so these
    # colours are ours. The legend lists only units present in the box.
    classes:
      - { value: "0", label: "NHjf2 · Jezero fan 2", color: "#c9a26b" }
      - { value: "1", label: "NHjf1 · Jezero fan 1", color: "#a8754a" }
      - { value: "2", label: "Njf · Jezero floor", color: "#8fa6b8" }
      - { value: "3", label: "Nle · Lower etched", color: "#c98b9a" }
      - { value: "4", label: "Hnpf · Nili Planum fan", color: "#d8c27a" }
      - { value: "5", label: "Nnp2 · Nili Planum 2", color: "#8ea677" }
      - { value: "6", label: "Nnp1 · Nili Planum 1", color: "#6b7f5a" }
      - { value: "7", label: "Aeb · Eolian bedform", color: "#ead9a2" }
      - { value: "8", label: "su · Smooth, undivided", color: "#a9a9c9" }
      - { value: "9", label: "Nrb · Rugged bright", color: "#e0b7d6" }
      - { value: "10", label: "Nue · Upper etched", color: "#9b6f9e" }
      - { value: "11", label: "cr · Crater rim", color: "#8a5a44" }
      - { value: "12", label: "ce · Crater ejecta", color: "#d49a6a" }
      - { value: "13", label: "ci · Crater interior", color: "#6f8496" }
    credit: "Sun, V. Z., and Stack, K. M. (2020), Geologic map of Jezero crater and the Nili Planum region, Mars, USGS SIM 3464"
    caveat: "Mapped at 1:75,000 from orbit. Colours are ours, not the printed map's."

  - id: terrain
    name: 3D terrain
    group: view
    type: terrain
    url: terrain/tiles.json   # TileJSON: zoom range and bounds; tiles at terrain/{z}/{x}/{y}.png (CONTRACTS)
    # The whole crater, not just the walk box: the box has 240 m of relief, the crater about 1.5 km
    # (rim included). Only the route grid stays at the walk box.
    options: { minzoom: 8, maxzoom: 12, bounds: [18.0, 77.15, 18.8, 77.95] }   # z12 is about the 20 m cell size
    credit: "Derived from the CTX height map (NASA/JPL/MSSS; mosaic by USGS Astrogeology)"
    caveat: "Visual only, and the map draws Mars on Earth-sized tiles, so 1x looks about half as steep as it is. Slope and routes come from the height grid, not the 3D view."
