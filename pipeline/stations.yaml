# Walk stations in walking order. Owner: Sadia. Base (B) comes from jezero.yaml, not from here.
# Schema is a proposal (CONTRACTS.md defines stations.json, not this file).
# lat/lon are NOT written here: stations.py takes them from the rover waypoint file for each sol.
#
# Every sol below was checked against data/raw/M20_waypoints.json (NASA/JPL): each has a waypoint,
# and stations.py uses the last one of the sol. Heights in the notes are that file's elev_geoid.
# dwell_s is the team assumption station_dwell_s (1200 s, docs/assumptions.md), the same at every station.
stations:
  - id: S1
    name: Three Forks depot
    sol: 686            # last tube dropped, 28 Jan 2023 (NASA); first tube was sol 653. Waypoint height -2545.20 m.
    dwell_s: 1200
    task: "Collect the sample tubes Perseverance left at the Three Forks depot: 10 tubes laid out 5 to 15 m apart on flat ground at the foot of the delta."
  - id: S2
    name: Delta base (Hawksbill Gap)
    sol: 437            # start of the Hawksbill Gap ascent, sols 437-470 (Russell et al., LPSC 2023). Waypoint height -2540.00 m, 5.2 m above S1.
    dwell_s: 1200
    task: "Sample the base of the delta, where the layered rocks are thought to have formed in a lake."
  - id: S3
    name: Delta front, top of Hawksbill Gap
    sol: 464            # near the end of the Hawksbill Gap ascent, sols 437-470 (Russell et al., LPSC 2023). Waypoint height -2522.08 m, 17.9 m above S2 and 23.1 m above S1.
    dwell_s: 1200
    task: "Sample the layered rocks of the delta front at the top of the Hawksbill Gap climb, about 18 m above the delta base, to compare them with the samples taken at its foot."
